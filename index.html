<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>CoRstellation — fifteen years of CoR in pictures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/corstellation.css">
</head>
<body>

<!-- ---------------------------------------------------------------------
     The galaxy
     ------------------------------------------------------------------ -->
<div id="stage"><div id="world"></div></div>

<header>
  <div>
    <h1>CoRstellation</h1>
    <p class="sub" id="sub">loading…</p>
  </div>
  <nav>
    <a href="https://www.flickr.com/photos/cor-photos/albums" target="_blank" rel="noopener">Flickr</a>
  </nav>
</header>

<div id="years" aria-hidden="true"></div>

<div id="hud">
  <button id="zoomIn"  aria-label="Zoom in">+</button>
  <button id="zoomOut" aria-label="Zoom out">−</button>
  <button id="showAll">All</button>
</div>

<p id="hint">drag to move · scroll or pinch to zoom · click an album to open it</p>
<p id="notice" hidden></p>

<!-- ---------------------------------------------------------------------
     Inside an album
     ------------------------------------------------------------------ -->
<section id="album" hidden>
  <header class="abar">
    <button id="back">← Back</button>
    <div>
      <h2 id="aTitle"></h2>
      <p id="aMeta"></p>
    </div>
    <a id="aFlickr" target="_blank" rel="noopener">Open on Flickr</a>
  </header>
  <div id="pstage"><div id="pworld"></div></div>
  <p id="aMore" hidden></p>
</section>

<!-- ---------------------------------------------------------------------
     One photograph, large
     ------------------------------------------------------------------ -->
<div id="light" hidden>
  <button id="lightClose" aria-label="Close">×</button>
  <button id="lightPrev"  aria-label="Previous">‹</button>
  <img id="lightImg" alt="">
  <button id="lightNext"  aria-label="Next">›</button>
  <p id="lightCap"></p>
</div>

<!-- Public Flickr application key of the CoR. It identifies the application
     and grants no write access. The application secret is not here and is not
     needed to read public photographs. -->
<script>window.FLICKR_KEY = "7ffcea1edea88202e277b41b0f0e2971";</script>
<script src="data/albums.js"></script>
<script src="assets/corstellation.js"></script>
</body>
</html>
